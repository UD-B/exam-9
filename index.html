<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body>
    <header>
        <img src="icons8-protect-50.png" alt="shield">
        <p>SIGINT OPS</p>
        <button><span class="span1">&#8226; <p>SECURE &#8226 ONLINE</p></span></button>
    </header>
    <main>
        <section class="section1">
            <div class='radar'>
                <div class='sweep'></div>
            </div>
            <p class="row1">24</p>
            <p class="row1">ACTIVE</p>
            <p class="row1"></p>
            <p class="row1"></p>
        </section>
        <section class="section2">
            <button class="button1"></button>
            <button class="button2"></button>
            <button class="button3"></button>
        </section>
        <section class="section3">
            <section class="nest-sec1">
                <button>CRITICAL</button>
                <p>In Progress</p>
                <p>Operation Nightfall</p>
                <span class="span1"><span class="span2"><p>65%</p></span></span>
            </section>
            <section class="nest-sec2">
                <button>HIGH</button>
                <p>Analyzing</p>
                <p>Signal Intercept Alpha</p>
                <span class="span1"><span class="span2"><p>40%</p></span></span>
            </section>
            <section class="nest-sec3">
                <button>MEDIUM</button>
                <p>Pending</p>
                <p>Asset Recovery</p>
                <span class="span1"><span class="span2"><p>15%</p></span></span>
            </section>
            <section class="nest-sec4">
                <button>HIGH</button>
                <p>Active</p>
                <p>Cyber Defense Grid</p>
                <span class="span1"><span class="span2"><p>80%</p></span></span>
            </section>
        </section>
        <section class="section4">
            <span class="span2">&#8226;</span>
            <p>THREAT DETECTED</p>
        </section>
    </main>
    <footer>
        <section class="nest-sec5">
            <i class="fa-solid fa-heart-pulse"></i>
            <p>Dashboard</p>
            <i class="fa-solid fa-grip-lines"></i>
        </section>
        <section class="nest-sec6">
            <i class="fa-solid fa-tower-broadcast"></i>
            <p>Feed</p>
        </section>
        <section class="nest-sec7">
            <i class="fa-solid fa-file-lines"></i>
            <p>Brief</p>
        </section>
    </footer>
</body>

</html>
