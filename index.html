<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body>
    <header>
        <img src="icons8-protect-50.png" alt="shield">
        <p>SIGINT OPS</p>
        <button><span class="span0">&#8226;</span><p>SECURE &#8226 ONLINE</p></button>
    </header>
    <main class="main">
        <section class="section1">
            <div class='radar'>
                <div class='sweep'></div>
            </div>
            <p class="row1">24</p>
            <p class="row2">ACTIVE</p>
            <p class="row3">07</p>
            <p class="row4">PRIORITY ALERTS</p>
        </section>
        <section class="section2">
            <button class="button1">
                <i class="fa-solid fa-bolt-lightning"></i>
                <p>New Brief</p>
            </button>
            <button class="button2">
                <p> &lt &gt Decode</p>
            </button>
            <button class="button3">
                <i class="fa-solid fa-jet-fighter-up"></i>
                <p>Request Drone</p>
            </button>
        </section>
        <section class="section3">
            <section class="nest-sec1">
                <button>CRITICAL</button>
                <p class="p1">In Progress</p>
                <p class="p2">Operation Nightfall</p>
                <span class="span1"><span class="span2">
                </span></span>
                <p class="p3">65%</p>
            </section>
            <section class="nest-sec2">
                <button>HIGH</button>
                <p class="p1">Analyzing</p>
                <p class="p2">Signal Intercept Alpha</p>
                <span class="span1"><span class="span2">
                </span></span>
                <p class="p3">40%</p>
            </section>
            <section class="nest-sec3">
                <button>MEDIUM</button>
                <p class="p1">Pending</p>
                <p class="p2">Asset Recovery</p>
                <span class="span1"><span class="span2">
                </span></span>
                <p class="p3">15%</p>
            </section>
            <section class="nest-sec4">
                <button>HIGH</button>
                <p class="p1">Active</p>
                <p class="p2">Cyber Defense Grid</p>
                <span class="span1"><span class="span2">
                </span></span>
                <p class="p3">80%</p>
            </section>
        </section>
        <section class="section4">
            <button><span class="span4">&#8226;</span><p>THREAT DETECTED</p></button>
        </section>
    </main>
    <footer>
            <i class="i1 fa-solid fa-heart-pulse"></i>
            <p class="pa">Dashboard</p>
            <i class="i2 fa-solid fa-grip-lines"></i>
            <i class="i3 fa-solid fa-tower-broadcast"></i>
            <p class="pb">Feed</p>
            <i class="i4 fa-solid fa-file-lines"></i>
            <p class="pc">Brief</p>
    </footer>
</body>

</html>
